
name: Build CLFLIX TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Check project files
        run: |
          echo "Arquivos do projeto:"
          ls -la
          echo "Arquivos Gradle:"
          find . -maxdepth 3 \( -name "*.gradle" -o -name "settings.gradle" \)

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CLFLIX TV APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-TV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
