
name: Build CLFLIX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile CLFLIX
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="CLFLIX_MOBILE_REVISADO.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP do projeto não encontrado!"
            ls -la
            exit 1
          fi

          mkdir -p projeto
          unzip -q "$ZIP_FILE" -d projeto

          test -f projeto/settings.gradle
          test -f projeto/build.gradle
          test -f projeto/app/build.gradle
          test -f projeto/app/src/main/AndroidManifest.xml
          test -f projeto/app/src/main/java/com/clflix/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Java files
        run: |
          find projeto/app/src/main -type f -print

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p projeto clean assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-debug-apk
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          
