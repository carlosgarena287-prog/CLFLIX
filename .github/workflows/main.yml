
name: Build CLFLIX Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK nao encontrado."
            exit 1
          fi

          MANAGER=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$MANAGER" ]; then
            echo "::error::sdkmanager nao encontrado."
            find "$SDK" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Aceitar licencas
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

      - name: Instalar SDK 35
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Encontrar projeto Android
        shell: bash
        run: |
          echo "Arquivos do repositorio:"
          find . -maxdepth 5 -type f \
            -not -path './.git/*' | sort

          SETTINGS=$(find . -type f \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Nao encontrei settings.gradle."
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/build.gradle" ] || \
             [ ! -f "$DIR/app/build.gradle" ] || \
             [ ! -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Estrutura Android incompleta em $DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $DIR"

      - name: Compilar APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Verificar APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::O APK nao foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Mobile-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
