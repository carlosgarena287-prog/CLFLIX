
name: Build CLFLIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CLFLIX_PobreFlix_Fullscreen_Fix.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Instalar unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extrair e localizar projeto
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="CLFLIX_PobreFlix_Fullscreen_Fix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo $ZIP não encontrado na raiz do repositório."
            ls -la
            exit 1
          fi

          unzip -o "$ZIP" -d projeto

          SETTINGS=$(find projeto -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado dentro do ZIP."
            find projeto -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find projeto -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            find projeto -type f | sort
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-debug-apk
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
