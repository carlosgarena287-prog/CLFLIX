
name: Build CLFLIX Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CLFLIX Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar SDK Manager
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager nao encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Licencas Android
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

      - name: Instalar SDK 35
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "CLFLIX_MOBILE_PRONTO_GITHUB.zip" \
            -print -quit)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted_project
            unzip -oq "$ZIP" -d extracted_project
          fi

          SETTINGS=$(find . -type f \
            -name settings.gradle \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle nao encontrado"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          for FILE in build.gradle app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/clflix/app/MainActivity.java; do
            test -f "$DIR/$FILE" || {
              echo "::error::Arquivo ausente: $DIR/$FILE"
              exit 1
            }
          done

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar CLFLIX
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            clean assembleDebug 2>&1 | tee build.log

      - name: Mostrar causa da falha
        if: always()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo "========== ERRO DA COMPILACAO =========="
            grep -n -i -E \
              -B 4 -A 8 \
              "What went wrong|error:|Execution failed|Could not" \
              build.log | tail -100 || true
            echo "========== FINAL DO LOG =========="
            tail -60 build.log
          fi

      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-DIAGNOSTICO
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Confirmar compilacao
        if: steps.compile.outcome == 'success'
        run: |
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Disponibilizar APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Mobile-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Falhar se compilacao nao passou
        if: steps.compile.outcome != 'success'
        run: |
          echo "::error::A compilacao Android falhou. Consulte o diagnostico acima."
          exit 1
          
