
name: Build CLFLIX Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          SDK="$ANDROID_HOME"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK nao encontrado."
            exit 1
          fi

          MANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$MANAGER" ]; then
            echo "::error::sdkmanager nao encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"

      - name: Aceitar licencas Android
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

      - name: Instalar Android SDK 35
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extrair ZIP e localizar projeto
        shell: bash
        run: |
          set -e

          echo "Procurando ZIP do CLFLIX..."

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "CLFLIX_MOBILE_PRONTO_GITHUB.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f \
              -iname "*.zip" -print -quit)
          fi

          if [ -n "$ZIP" ]; then
            echo "Extraindo: $ZIP"
            mkdir -p extracted_project
            unzip -oq "$ZIP" -d extracted_project
          else
            echo "Nenhum ZIP encontrado. Procurando projeto enviado diretamente."
          fi

          SETTINGS=$(find . -type f \
            -name settings.gradle \
            -not -path "*/.gradle/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Nao encontrei settings.gradle nem dentro do ZIP."
            echo "Arquivos encontrados:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/build.gradle" ]; then
            echo "::error::build.gradle nao encontrado em $DIR"
            exit 1
          fi

          if [ ! -f "$DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle nao encontrado em $DIR"
            exit 1
          fi

          if [ ! -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml nao encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $DIR"

      - name: Compilar CLFLIX
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Conferir APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK nao foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Mobile-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
