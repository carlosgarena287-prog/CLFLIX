
name: Build CLFLIX Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK Manager
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager nao encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Aceitar licencas
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

      - name: Instalar SDK 35
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "CLFLIX_MOBILE_PRONTO_GITHUB.zip" \
            -print -quit)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted_project
            unzip -oq "$ZIP" -d extracted_project
          fi

          SETTINGS=$(find . -type f \
            -name settings.gradle \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle nao encontrado"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          test -f "$DIR/build.gradle"
          test -f "$DIR/app/build.gradle"
          test -f "$DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar CLFLIX com diagnostico
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            clean assembleDebug 2>&1 | tee build.log

      - name: Salvar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-DIAGNOSTICO
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verificar APK
        if: success()
        run: |
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Mobile-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
