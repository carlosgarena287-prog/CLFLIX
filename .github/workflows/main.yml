
name: Build CLFLIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CLFLIX_Android_Project_with_Cloud_Build.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Preparar SDK Android
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o CLFLIX_Android_Project_with_Cloud_Build.zip -d projeto
          find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          SETTINGS=$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Não encontrei settings.gradle no ZIP."
            find projeto -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projeto encontrado em: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
