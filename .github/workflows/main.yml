name: Build CLFLIX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile CLFLIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi
          echo "APK encontrado: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
