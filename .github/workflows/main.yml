
name: Build CLFLIX Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CLFLIX Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null \
              | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::SDK Manager nao encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Aceitar licencas Android
        shell: bash
        run: |
          set +e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "::error::O SDK Manager nao conseguiu aceitar as licencas."
            exit 1
          fi

          echo "Licencas Android aceitas."

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extrair e validar projeto
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="CLFLIX_MOBILE_PRONTO_GITHUB.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP do CLFLIX nao encontrado."
            ls -la
            exit 1
          fi

          unzip -t "$ZIP"

          mkdir -p "$RUNNER_TEMP/clflix-project"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/clflix-project"

          ROOT="$RUNNER_TEMP/clflix-project"

          SETTINGS="$(find "$ROOT" -type f \
            -name settings.gradle \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle nao encontrado."
            find "$ROOT" -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          for FILE in \
            build.gradle \
            settings.gradle \
            gradle.properties \
            app/build.gradle \
            app/src/main/AndroidManifest.xml; do

            if [ ! -f "$PROJECT_DIR/$FILE" ]; then
              echo "::error::Arquivo ausente: $FILE"
              exit 1
            fi
          done

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto validado: $PROJECT_DIR"

      - name: Compilar CLFLIX
        id: compile
        shell: bash
        run: |
          set +e

          gradle -p "${{ steps.project.outputs.dir }}" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            clean assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/clflix-build.log"

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Falha na compilacao Gradle."
            grep -n -i -E \
              -B 3 -A 6 \
              "What went wrong|error:|Execution failed|Could not" \
              "$RUNNER_TEMP/clflix-build.log" | tail -100 || true
            exit "$RESULT"
          fi

      - name: Verificar APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK nao foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Mobile-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-DIAGNOSTICO
          path: ${{ runner.temp }}/clflix-build.log
          if-no-files-found: ignore
          retention-days: 7
          
