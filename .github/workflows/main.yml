
name: Build CLFLIX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CLFLIX_INTERFACE_PROPRIA_MOBILE.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile CLFLIX
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="CLFLIX_INTERFACE_PROPRIA_MOBILE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP não encontrado: $ZIP_FILE"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -oq "$ZIP_FILE" -d source

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/build.gradle" ] &&
               [ -f "$candidate/app/build.gradle" ] &&
               [ -f "$candidate/app/src/main/AndroidManifest.xml" ] &&
               [ -f "$candidate/app/src/main/java/com/clflix/app/MainActivity.java" ]; then

              if [ -z "$PROJECT_DIR" ] ||
                 [ "${#candidate}" -lt "${#PROJECT_DIR}" ]; then
                PROJECT_DIR="$candidate"
              fi
            fi
          done < <(find source -type f -name settings.gradle -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android completo não encontrado."
            find source -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          echo "Arquivos Java:"
          find "$PROJECT_DIR/app/src/main" -type f

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.dir }}" \
            clean assembleDebug

      - name: Verify APK
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK não foi encontrado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
