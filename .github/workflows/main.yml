
name: Build CLFLIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CLFLIX_Android_Project_with_Cloud_Build.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          unzip -o CLFLIX_Android_Project_with_Cloud_Build.zip -d projeto
          find projeto -name gradlew -type f

      - name: Compilar APK
        run: |
          cd projeto/CLFLIX_Android_Project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-debug-apk
          path: projeto/CLFLIX_Android_Project/app/build/outputs/apk/debug/*.apk
          
