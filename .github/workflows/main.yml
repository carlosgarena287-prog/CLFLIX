
name: Build CLFLIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CLFLIX_Android_Project_with_Cloud_Build.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java e Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o CLFLIX_Android_Project_with_Cloud_Build.zip -d projeto
          find projeto -name gradlew -type f

      - name: Compilar APK
        run: |
          cd projeto/CLFLIX_Android_Project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-debug-apk
          path: projeto/CLFLIX_Android_Project/app/build/outputs/apk/debug/*.apk
          
