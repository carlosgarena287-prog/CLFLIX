
name: Build CLFLIX Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -name 'CLFLIX_MOBILE_PRONTO_GITHUB.zip' -print -quit)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted_project
            unzip -oq "$ZIP" -d extracted_project
          fi

          SETTINGS=$(find . -type f -name settings.gradle \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle nao encontrado"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          test -f "$DIR/build.gradle"
          test -f "$DIR/app/build.gradle"
          test -f "$DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto: $DIR"

      - name: Compilar CLFLIX com diagnostico
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            --info \
            clean assembleDebug 2>&1 | tee build.log

      - name: Salvar log de compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Conferir APK
        if: success()
        run: |
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Mobile-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
