
name: Build CLFLIX TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-TV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
