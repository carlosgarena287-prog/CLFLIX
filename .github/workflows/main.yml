name: CLFLIX Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found on the GitHub runner."
            find /usr/local/lib/android -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found sdkmanager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [[ "$sdk_status" -ne 0 ]]; then
            echo "::error::sdkmanager could not accept Android SDK licenses (exit $sdk_status)."
            exit "$sdk_status"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Locate and validate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"

          if [[ ! -f "$ROOT/settings.gradle" ]]; then
            ZIP=""
            for candidate in \
              "$ROOT/CLFLIX_MOBILE_REVISADO_FINAL.zip" \
              "$ROOT/CLFLIX_MOBILE_PRONTO_GITHUB.zip"; do
              if [[ -f "$candidate" ]]; then ZIP="$candidate"; break; fi
            done

            if [[ -z "$ZIP" ]]; then
              mapfile -t ZIP_FILES < <(find "$ROOT" -maxdepth 2 -type f -iname '*.zip' -print | sort)
              if [[ ${#ZIP_FILES[@]} -eq 1 ]]; then ZIP="${ZIP_FILES[0]}"; fi
            fi

            if [[ -n "$ZIP" ]]; then
              echo "Using project archive: $ZIP"
              unzip -t "$ZIP"
              EXTRACT_DIR="$RUNNER_TEMP/clflix-source"
              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"
              unzip -oq "$ZIP" -d "$EXTRACT_DIR"
              ROOT="$EXTRACT_DIR"
            fi
          fi

          SETTINGS="$(find "$ROOT" -type f -name settings.gradle \
            -not -path '*/.gradle/*' -not -path '*/build/*' \
            -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo "::error::settings.gradle was not found. Upload the ZIP or extract its contents into the repository root."
            find "$ROOT" -maxdepth 6 -type f -print | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          REQUIRED=(
            build.gradle
            settings.gradle
            gradle.properties
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/clflix/app/MainActivity.java
          )
          for file in "${REQUIRED[@]}"; do
            if [[ ! -f "$PROJECT_DIR/$file" ]]; then
              echo "::error::Required project file is missing: $file"
              exit 1
            fi
          done

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"
          echo "Root Gradle file:"
          cat "$PROJECT_DIR/build.gradle"
          echo "App Gradle file:"
          cat "$PROJECT_DIR/app/build.gradle"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "${{ steps.project.outputs.dir }}" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            clean assembleDebug 2>&1 | tee "$RUNNER_TEMP/clflix-build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Build finished without producing app-debug.apk."
            exit 1
          fi
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Mobile-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CLFLIX-Build-Log
          path: ${{ runner.temp }}/clflix-build.log
          if-no-files-found: ignore
          retention-days: 7
